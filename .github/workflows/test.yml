# Runs every check on each push and pull request: 45 unit checks in Node, then four browser suites
# (flow, product, tour, phone) in headless Chromium against the local server with the mock model.
# No API key is needed or used.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Unit and browser tests
        run: npm test
        env:
          LOG_SILENT: '1'
      - name: Keep screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/shots/
          retention-days: 7
